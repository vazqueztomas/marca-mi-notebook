[project]
name = "marca-mi-notebook-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "psycopg2-binary>=2.9",
    "sqlalchemy>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "mercadopago>=2.0",
    "resend>=0.3",
    "httpx>=0.24",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = ["pytest>=7.4", "pytest-asyncio>=0.21", "pytest-mock>=3.11"]

[tool.poe.tasks]
dev = "uvicorn app:app --reload --port 8000"
test = "pytest tests/ -v"
